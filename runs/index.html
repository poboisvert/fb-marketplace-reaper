<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketplace runs</title>
<style>
  :root { color-scheme: light; --ink: #1c1917; --muted: #78716c; --line: #e7e5e4; --paper: #f6f3ee; --card: #fff; --drop: #c2410c; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 ui-sans-serif, system-ui, sans-serif; color: var(--ink); background: var(--paper); }
  header { padding: 28px 28px 4px; }
  header h1 { margin: 0; font-size: 28px; letter-spacing: -0.03em; }
  header p { margin: 6px 0 0; color: var(--muted); max-width: 42rem; }
  .layout { display: grid; grid-template-columns: 240px 1fr; gap: 8px; padding: 16px 20px 40px; }
  nav { position: sticky; top: 16px; align-self: start; display: flex; flex-direction: column; gap: 8px; }
  nav button { text-align: left; padding: 12px 14px; border: 1px solid transparent; border-radius: 12px; background: transparent; color: var(--ink); cursor: pointer; }
  nav button:hover { background: rgba(255,255,255,0.7); }
  nav button[aria-current="true"] { background: var(--ink); color: #fff; }
  main { min-width: 0; }
  .summary { margin: 4px 8px 12px; color: var(--muted); font-size: 13px; }
  .fresh { margin: 0 0 18px; padding: 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); }
  .fresh h2, .trend h2 { margin: 0 8px 12px; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .trend { margin: 0 0 18px; padding: 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); }
  .trend svg { display: block; width: 100%; height: auto; }
  .trend .axis { fill: var(--muted); font-size: 11px; }
  .trend .grid { stroke: var(--line); }
  .trend .dot { fill: #a8a29e; fill-opacity: 0.55; }
  .trend .line { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
  .trend .median { fill: var(--ink); }
  .trend .legend { margin: 6px 8px 0; color: var(--muted); font-size: 12px; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: 0 1px 2px rgba(28,25,23,0.04); }
  .card.repriced { border: 2px solid #15803d; }
  .row { width: 100%; display: grid; grid-template-columns: 84px 120px 1fr auto 28px; gap: 16px; align-items: center; padding: 14px 16px; border: 0; background: transparent; text-align: left; cursor: pointer; color: inherit; font: inherit; }
  .thumb-wrap { width: 84px; height: 64px; border-radius: 10px; background: #1c1917; overflow: hidden; }
  .thumb, .preview { width: 100%; height: 100%; object-fit: contain; object-position: top center; display: block; background: #1c1917; }
  .preview { height: 280px; width: calc(100% - 32px); margin: 0 16px 12px; border-radius: 12px; background: #f5f5f4; }
  .page-link { display: block; margin: 0 16px 12px; color: inherit; text-decoration: none; }
  .page-link .preview { width: 100%; height: auto; max-height: 560px; margin: 0; object-fit: contain; object-position: top center; background: #1c1917; }
  .page-url { display: block; margin-top: 8px; color: var(--muted); font-size: 12px; word-break: break-all; }
  .row:hover { background: #fafaf9; }
  .price { font-size: 18px; font-weight: 650; letter-spacing: -0.02em; }
  .card.dropped .price { color: var(--drop); }
  .was { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; font-weight: 500; text-decoration: line-through; }
  .title { display: block; font-weight: 600; }
  .sub { display: block; margin-top: 2px; color: var(--muted); font-size: 13px; }
  .updated { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .chevron { width: 18px; height: 18px; border-right: 2px solid #a8a29e; border-bottom: 2px solid #a8a29e; transform: rotate(45deg); transition: transform 160ms ease; justify-self: center; }
  .card.open .chevron { transform: rotate(225deg); }
  .panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 180ms ease; }
  .card.open .panel { grid-template-rows: 1fr; }
  .panel-inner { overflow: hidden; }
  .facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 0 16px 16px; padding: 14px; border-radius: 12px; background: #fafaf9; }
  .facts span { display: block; color: var(--muted); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }
  .facts strong { display: block; margin-top: 4px; font-size: 14px; font-weight: 600; }
  .actions { padding: 0 16px 16px; }
  .actions a { display: inline-flex; align-items: center; padding: 8px 12px; border-radius: 999px; background: var(--ink); color: #fff; text-decoration: none; font-size: 13px; font-weight: 600; }
  .actions a:hover { background: #44403c; }
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
    nav { position: static; flex-direction: row; overflow-x: auto; }
    .row { grid-template-columns: 84px 1fr auto; }
    .updated { display: none; }
    .facts { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>Marketplace runs</h1>
  <p>Open a search, then a car. The details open under that car. A later lower price keeps the original.</p>
</header>
<div class="layout">
  <nav id="dates"></nav>
  <main>
    <div id="summary" class="summary">Loading listings…</div>
    <section id="trend" class="trend" hidden>
      <h2>Original price trend</h2>
      <svg id="trend-chart" viewBox="0 0 720 220" role="img" aria-label="Original price by listing date"></svg>
      <div id="trend-legend" class="legend"></div>
    </section>
    <section id="fresh" class="fresh" hidden>
      <h2>New</h2>
      <div id="fresh-list" class="list"></div>
    </section>
    <div id="list" class="list"></div>
  </main>
</div>
<script>
const datesEl = document.getElementById("dates");
const listEl = document.getElementById("list");
const freshEl = document.getElementById("fresh");
const freshListEl = document.getElementById("fresh-list");
const summaryEl = document.getElementById("summary");
const trendEl = document.getElementById("trend");
const trendChartEl = document.getElementById("trend-chart");
const trendLegendEl = document.getElementById("trend-legend");
const money = new Intl.NumberFormat(undefined, { style: "currency", currency: "CAD", maximumFractionDigits: 0 });
let runs = {};
let selected = "";
let openSlug = "";
let signatureText = "";

function when(value) {
  const date = new Date(value || "");
  if (Number.isNaN(date.getTime())) return value || "—";
  return date.toLocaleString(undefined, { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" });
}

function pictureFile(item) {
  return item.image || item.page_preview || "";
}

function addFact(parent, label, value) {
  const item = document.createElement("div");
  const name = document.createElement("span");
  const number = document.createElement("strong");
  name.textContent = label;
  number.textContent = value || "—";
  item.append(name, number);
  parent.append(item);
}

function signature(data) {
  return JSON.stringify(Object.keys(data).sort().map((name) => [
    name,
    (data[name] || []).map((item) => [item.slug, item.price, item.updated_at, item.price_dropped, item.title]),
  ]));
}

function renderDates() {
  datesEl.replaceChildren();
  const dates = Object.keys(runs).sort();
  if (!dates.length) {
    datesEl.textContent = "No searches yet.";
    return;
  }
  for (const day of dates) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = day + " · " + runs[day].length;
    button.setAttribute("aria-current", day === selected ? "true" : "false");
    button.addEventListener("click", () => { selected = day; openSlug = ""; renderDates(); renderItems(); });
    datesEl.append(button);
  }
}

function isNew(item) {
  const created = new Date(item.created_at || "");
  if (Number.isNaN(created.getTime())) return false;
  const now = new Date();
  return created.getFullYear() === now.getFullYear()
    && created.getMonth() === now.getMonth()
    && created.getDate() === now.getDate();
}

function hasNewPrice(item) {
  return Boolean(item.price_dropped) || Boolean(item.original_price && item.price && item.original_price !== item.price);
}

function renderItems() {
  listEl.replaceChildren();
  freshListEl.replaceChildren();
  const items = (runs[selected] || []).slice().sort((a, b) => {
    const aa = Number(a.amount);
    const bb = Number(b.amount);
    return (Number.isFinite(aa) ? aa : 0) - (Number.isFinite(bb) ? bb : 0);
  });
  const freshItems = items.filter(isNew);
  const olderItems = items.filter((item) => !isNew(item));
  freshEl.hidden = freshItems.length === 0;
  summaryEl.textContent = selected
    ? items.length + " listing" + (items.length === 1 ? "" : "s") + " in " + selected
    : "No searches yet.";
  renderTrend(items);
  for (const item of freshItems) freshListEl.append(buildCard(item));
  for (const item of olderItems) listEl.append(buildCard(item));
}

function dayKey(value) {
  const date = new Date(value || "");
  if (Number.isNaN(date.getTime())) return "";
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  return date.getFullYear() + "-" + month + "-" + day;
}

function originalAmount(item) {
  const amount = Number(item.original_amount ?? item.amount);
  return Number.isFinite(amount) && amount > 0 ? amount : null;
}

function median(values) {
  const sorted = values.slice().sort((a, b) => a - b);
  const middle = Math.floor(sorted.length / 2);
  return sorted.length % 2 ? sorted[middle] : (sorted[middle - 1] + sorted[middle]) / 2;
}

function svg(tag, attrs, text) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [name, value] of Object.entries(attrs)) node.setAttribute(name, value);
  if (text) node.textContent = text;
  return node;
}

function renderTrend(items) {
  trendChartEl.replaceChildren();
  const points = items
    .map((item) => ({ day: dayKey(item.created_at), amount: originalAmount(item), item }))
    .filter((point) => point.day && point.amount);
  trendEl.hidden = points.length === 0;
  if (!points.length) return;

  const days = [...new Set(points.map((point) => point.day))].sort();
  const medians = days.map((day) => median(points.filter((point) => point.day === day).map((point) => point.amount)));
  const amounts = points.map((point) => point.amount);
  let low = Math.min(...amounts);
  let high = Math.max(...amounts);
  if (low === high) { low -= 1000; high += 1000; }
  low = Math.floor(low / 1000) * 1000;
  high = Math.ceil(high / 1000) * 1000;

  const width = 720, height = 220, left = 72, right = 24, top = 12, bottom = 32;
  const times = days.map((day) => new Date(day + "T00:00").getTime());
  const first = times[0], last = times[times.length - 1];
  const x = (index) => first === last ? left + (width - left - right) / 2 : left + (times[index] - first) * (width - left - right) / (last - first);
  const y = (amount) => top + (high - amount) * (height - top - bottom) / (high - low);

  for (let tick = 0; tick <= 4; tick++) {
    const amount = low + (high - low) * tick / 4;
    trendChartEl.append(
      svg("line", { class: "grid", x1: left, x2: width - right, y1: y(amount), y2: y(amount) }),
      svg("text", { class: "axis", x: left - 8, y: y(amount) + 4, "text-anchor": "end" }, money.format(amount)),
    );
  }
  const step = Math.ceil(days.length / 8);
  days.forEach((day, index) => {
    if (index % step && index !== days.length - 1) return;
    const label = new Date(times[index]).toLocaleDateString(undefined, { month: "short", day: "numeric" });
    trendChartEl.append(svg("text", { class: "axis", x: x(index), y: height - 10, "text-anchor": "middle" }, label));
  });

  for (const point of points) {
    const dot = svg("circle", { class: "dot", cx: x(days.indexOf(point.day)), cy: y(point.amount), r: 3.5 });
    dot.append(svg("title", {}, (point.item.title || point.item.slug) + " · " + money.format(point.amount)));
    trendChartEl.append(dot);
  }
  trendChartEl.append(svg("polyline", { class: "line", points: medians.map((amount, index) => x(index) + "," + y(amount)).join(" ") }));
  medians.forEach((amount, index) => {
    const marker = svg("circle", { class: "median", cx: x(index), cy: y(amount), r: 4.5 });
    marker.append(svg("title", {}, days[index] + " median · " + money.format(amount)));
    trendChartEl.append(marker);
  });

  trendLegendEl.textContent = "Line: median original price per listing date. Dots: each listing. "
    + points.length + " listings across " + days.length + " day" + (days.length === 1 ? "" : "s") + ".";
}

function buildCard(item) {
    const card = document.createElement("article");
    card.className = "card" + (hasNewPrice(item) ? " repriced" : "") + (item.price_dropped ? " dropped" : "");
    if (item.slug === openSlug) card.classList.add("open");

    const button = document.createElement("button");
    button.type = "button";
    button.className = "row";
    button.setAttribute("aria-expanded", item.slug === openSlug ? "true" : "false");

    const picture = pictureFile(item);
    const thumbWrap = document.createElement("span");
    thumbWrap.className = "thumb-wrap";
    if (picture) {
      const thumb = document.createElement("img");
      thumb.className = "thumb";
      thumb.alt = "";
      thumb.src = encodeURI(selected + "/" + picture);
      thumbWrap.append(thumb);
    }

    const price = document.createElement("span");
    price.className = "price";
    price.textContent = item.price || "—";
    if (hasNewPrice(item) && item.original_price && item.original_price !== item.price) {
      const was = document.createElement("span");
      was.className = "was";
      was.textContent = item.original_price;
      price.append(was);
    }

    const meta = document.createElement("span");
    const title = document.createElement("span");
    title.className = "title";
    title.textContent = item.title || item.slug || "Listing";
    const sub = document.createElement("span");
    sub.className = "sub";
    sub.textContent = [item.location, item.seller_name].filter(Boolean).join(" · ");
    meta.append(title, sub);

    const updated = document.createElement("span");
    updated.className = "updated";
    updated.textContent = when(item.updated_at);
    const chevron = document.createElement("span");
    chevron.className = "chevron";
    chevron.setAttribute("aria-hidden", "true");
    button.append(thumbWrap, price, meta, updated, chevron);

    const panel = document.createElement("div");
    panel.className = "panel";
    const inner = document.createElement("div");
    inner.className = "panel-inner";
    if (picture && item.url) {
      const pageLink = document.createElement("a");
      pageLink.className = "page-link";
      pageLink.href = item.url;
      pageLink.target = "_blank";
      pageLink.rel = "noreferrer";
      const preview = document.createElement("img");
      preview.className = "preview";
      preview.alt = item.title || "Listing photo";
      preview.src = encodeURI(selected + "/" + picture);
      const address = document.createElement("span");
      address.className = "page-url";
      address.textContent = item.url;
      pageLink.append(preview, address);
      inner.append(pageLink);
    } else if (picture) {
      const preview = document.createElement("img");
      preview.className = "preview";
      preview.alt = item.title || "Listing photo";
      preview.src = encodeURI(selected + "/" + picture);
      inner.append(preview);
    }
    const facts = document.createElement("div");
    facts.className = "facts";
    addFact(facts, "Price", item.price);
    addFact(facts, "Original", item.original_price || item.price);
    addFact(facts, "Created", when(item.created_at));
    addFact(facts, "Updated", when(item.updated_at));
    inner.append(facts);
    if (item.url) {
      const actions = document.createElement("div");
      actions.className = "actions";
      const link = document.createElement("a");
      link.href = item.url;
      link.target = "_blank";
      link.rel = "noreferrer";
      link.textContent = "Open listing";
      actions.append(link);
      inner.append(actions);
    }
    panel.append(inner);

    button.addEventListener("click", () => {
      const willOpen = !card.classList.contains("open");
      for (const other of document.querySelectorAll("#fresh-list .card.open, #list .card.open")) {
        other.classList.remove("open");
        other.querySelector(".row").setAttribute("aria-expanded", "false");
      }
      openSlug = willOpen ? item.slug : "";
      card.classList.toggle("open", willOpen);
      button.setAttribute("aria-expanded", willOpen ? "true" : "false");
    });
    card.append(button, panel);
    return card;
}

function showLoadError() {
  datesEl.textContent = "";
  trendEl.hidden = true;
  freshListEl.replaceChildren();
  freshEl.hidden = true;
  listEl.replaceChildren();
  summaryEl.textContent = "Start facebook-marketplace serve, then open http://127.0.0.1:8767/index.html";
}

async function loadRuns() {
  const response = await fetch("index.json", { cache: "no-store" });
  if (!response.ok) throw new Error("index.json missing");
  const manifest = await response.json();
  const loaded = await Promise.all(Object.entries(manifest).map(async ([folder, files]) => {
    const names = Array.isArray(files) ? files : [];
    const items = (await Promise.all(names.map(async (file) => {
      try {
        const itemResponse = await fetch(encodeURI(folder + "/" + file), { cache: "no-store" });
        if (!itemResponse.ok) return null;
        return await itemResponse.json();
      } catch {
        return null;
      }
    }))).filter(Boolean);
    return [folder, items];
  }));
  return Object.fromEntries(loaded);
}

async function refresh() {
  if (location.protocol === "file:") {
    showLoadError();
    return;
  }
  try {
    const next = await loadRuns();
    const nextSignature = signature(next);
    if (nextSignature === signatureText) return;
    signatureText = nextSignature;
    runs = next;
    const dates = Object.keys(runs).sort();
    if (!dates.includes(selected)) {
      selected = dates[0] || "";
      openSlug = "";
    }
    renderDates();
    renderItems();
  } catch (error) {
    if (!signatureText) showLoadError();
  }
}

refresh();
setInterval(refresh, 15000);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") refresh();
});
</script>
</body>
</html>
